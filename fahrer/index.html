<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Germersheim - Mitarbeiterportal</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Taxi Germersheim Mitarbeiter">
  <meta name="theme-color" content="#090b12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="driver-app">
    <section class="driver-login" data-screen="login">
      <header class="driver-login-head">
        <img src="../logo.png" alt="Taxi Germersheim Logo">
        <h1>Taxi Germersheim</h1>
        <p>MITARBEITER</p>
      </header>

      <form class="driver-login-form" data-employee-login-form>
        <label class="driver-login-field">
          <span>E-Mail-Adresse</span>
          <input class="driver-input" type="email" name="email" autocomplete="email" placeholder="max@example.com" required>
        </label>
        <label class="driver-login-field">
          <span>Passwort</span>
          <input class="driver-input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="driver-btn primary" type="submit">Anmelden</button>
      </form>

      <p class="demo-note" data-login-message hidden></p>
      <p class="demo-note" data-demo-hint hidden>Demo-Zugang: <strong>demo</strong> / <strong>demo</strong></p>
    </section>
  </main>

  <script src="../admin/supabase-config.js"></script>
  <script src="employee-supabase.js"></script>
  <script src="mitarbeiter-login.js"></script>
</body>
</html>
