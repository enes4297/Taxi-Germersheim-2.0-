<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Germersheim - Mitarbeiterportal</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="../admin/personal-shared.js"></script>
  <script src="../admin/qualitaet-shared.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="driver-app">
    <section class="driver-dashboard" style="display:block">
      <header class="driver-top">
        <div class="driver-identity"><span class="driver-avatar">MA</span><div class="driver-identity-meta"><strong data-portal-name>Mitarbeiter</strong><small data-portal-role>Rolle</small><small data-portal-status>Status</small></div></div>
        <div class="driver-top-actions"><button class="driver-btn ghost" type="button" data-portal-switch>Mitarbeiter wechseln</button></div>
      </header>

      <nav class="driver-mobile-nav" aria-label="Mitarbeiter Navigation">
        <button class="driver-mobile-tab is-active" type="button" data-portal-tab="start">Start</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="dienstplan">Dienstplan</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="urlaub">Urlaub</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="krank">Krankmeldung</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="dokumente">Dokumente</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="mitteilungen">Mitteilungen</button>
      </nav>

      <section class="driver-pane is-visible" data-portal-pane="start">
        <article class="driver-card driver-hero-card"><h2>Willkommen im Mitarbeiterportal</h2><div data-portal-summary></div><p class="demo-note">Nur organisatorische Demo-Daten. Keine Fahrtenverwaltung, keine Disposition, keine Qualitätsmodule.</p></article>
        <article class="driver-card"><h2>Heute und morgen</h2><div data-portal-kpis></div></article>
      </section>

      <section class="driver-pane" data-portal-pane="dienstplan"><article class="driver-card"><h2>Dienstplan</h2><div data-portal-shift-list></div></article></section>

      <section class="driver-pane" data-portal-pane="urlaub"><article class="driver-card"><h2>Urlaub</h2><div class="driver-summary-grid" data-portal-vac-summary></div><form data-portal-vac-form><div class="driver-list"><article class="driver-item"><label>Start<input type="date" name="start" required></label><label>Ende<input type="date" name="end" required></label><label>Art<select name="type"><option>Erholungsurlaub</option><option>Resturlaub</option><option>Sonderurlaub</option><option>unbezahlter Urlaub</option><option>halber Urlaubstag</option></select></label><label>Kommentar<input name="comment"></label><button class="driver-btn primary" type="submit">Antrag senden</button></article></div></form><div data-portal-vac-list></div></article></section>

      <section class="driver-pane" data-portal-pane="krank"><article class="driver-card"><h2>Krankmeldung</h2><div class="driver-summary-grid" data-portal-absence-summary></div><form data-portal-absence-form><div class="driver-list"><article class="driver-item"><label>Beginn<input type="date" name="start" required></label><label>Voraussichtliches Ende<input type="date" name="expectedEnd" required></label><label>Übermittlung<select name="via"><option>Telefonisch</option><option>Mitarbeiterportal</option><option>Persönlich</option></select></label><label>Hinweis<input name="note" placeholder="z. B. Rückruf gewünscht"></label><button class="driver-btn warning" type="submit">Krankmeldung senden</button></article></div></form><div data-portal-absence-list></div></article></section>

      <section class="driver-pane" data-portal-pane="dokumente"><article class="driver-card"><h2>Dokumente</h2><div data-portal-doc-list></div><form data-portal-doc-form><div class="driver-list"><article class="driver-item"><label>Dokumenttyp<select name="type"><option>Führerschein</option><option>Personenbeförderungsschein</option><option>Versicherung</option><option>Sonstiges Dokument</option></select></label><label>Hinweis<input name="note" placeholder="Dokumentstatus oder Rückfrage"></label><label>Datei<input type="file" name="demoFile" accept=".pdf,.jpg,.jpeg,.png"></label><button class="driver-btn" type="submit">Dokument einreichen</button></article></div></form></article></section>

      <section class="driver-pane" data-portal-pane="mitteilungen"><article class="driver-card"><h2>Mitteilungen</h2><div data-portal-msg-list></div></article></section>
    </section>
  </main>

  <div class="driver-modal" data-portal-modal hidden>
    <div class="driver-modal-backdrop" data-portal-close></div>
    <section class="driver-modal-dialog" role="dialog" aria-modal="true">
      <header class="driver-modal-head"><h3 data-portal-modal-title>Mitarbeiterportal</h3><button class="driver-btn ghost" type="button" data-portal-close>Schliessen</button></header>
      <div class="driver-modal-body" data-portal-modal-body></div>
      <footer class="driver-modal-foot"><button class="driver-btn" type="button" data-portal-close>Fertig</button></footer>
    </section>
  </div>

  <script src="../admin/ui-visible-terms.js"></script>
  <script src="../admin/ui-text.js"></script>
  <script src="mitarbeiter.js"></script>
</body>
</html>
