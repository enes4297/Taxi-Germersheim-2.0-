<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Germersheim - Mitarbeiterportal</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="../admin/personal-shared.js"></script>
  <script src="../admin/qualitaet-shared.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="driver-app">
    <section class="driver-dashboard" style="display:block">
      <header class="driver-top">
        <div class="driver-identity"><span class="driver-avatar">MA</span><div class="driver-identity-meta"><strong data-portal-name>Mitarbeiter</strong><small data-portal-role>Rolle</small><small data-portal-status>Status</small></div></div>
        <div class="driver-top-actions"><button class="driver-btn ghost" type="button" data-portal-switch>Mitarbeiter wechseln</button></div>
      </header>

      <nav class="driver-mobile-nav" aria-label="Mitarbeiter Navigation">
        <button class="driver-mobile-tab is-active" type="button" data-portal-tab="start">Start</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="schicht">Schicht</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="urlaub">Urlaub</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="dokumente">Dokumente</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="mitteilungen">Mitteilungen</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="qualitaet">Qualitaet</button>
        <button class="driver-mobile-tab" type="button" data-portal-tab="profil">Profil</button>
      </nav>

      <section class="driver-pane is-visible" data-portal-pane="start">
        <article class="driver-card"><h2>Mitarbeiter-Dashboard</h2><div data-portal-kpis></div><p class="demo-note">Nur organisatorische Demo-Daten. Keine Lohn- oder Gehaltslogik.</p></article>
        <article class="driver-card"><h2>Schnellaktionen</h2><div class="driver-card-actions-inline"><button class="driver-btn" type="button" data-portal-action="urlaub">Urlaub beantragen</button><button class="driver-btn" type="button" data-portal-action="krank">Krank melden</button><button class="driver-btn" type="button" data-portal-action="verfuegbar">Verfuegbarkeit eintragen</button><button class="driver-btn" type="button" data-portal-action="wunsch">Schichtwunsch senden</button><button class="driver-btn" type="button" data-portal-action="doku">Dokumentstatus ansehen</button><button class="driver-btn" type="button" data-portal-action="training">Schulung ansehen</button><button class="driver-btn" type="button" data-portal-action="msg">Mitteilungen oeffnen</button><button class="driver-btn" type="button" data-portal-action="call">Zentrale kontaktieren</button><button class="driver-btn" type="button" data-portal-action="qaTasks">Qualitaetsaufgaben</button><button class="driver-btn" type="button" data-portal-action="qaStatement">Stellungnahme</button><button class="driver-btn" type="button" data-portal-action="qaQuestion">Rueckfrage beantworten</button><button class="driver-btn" type="button" data-portal-action="qaConfirm">Pruefung bestaetigen</button><button class="driver-btn" type="button" data-portal-action="qaHints">Hinweise</button></div></article>
      </section>

      <section class="driver-pane" data-portal-pane="urlaub"><article class="driver-card"><h2>Urlaub</h2><form data-portal-vac-form><div class="driver-list"><article class="driver-item"><label>Start<input type="date" name="start" required></label><label>Ende<input type="date" name="end" required></label><label>Art<select name="type"><option>Erholungsurlaub</option><option>Resturlaub</option><option>Sonderurlaub</option><option>unbezahlter Urlaub</option><option>halber Urlaubstag</option></select></label><label>Kommentar<input name="comment"></label><button class="driver-btn primary" type="submit">Antrag senden</button></article></div></form><div data-portal-vac-list></div></article></section>

      <section class="driver-pane" data-portal-pane="schicht"><article class="driver-card"><h2>Verfuegbarkeit und Schichtwuensche</h2><form data-portal-av-form><div class="driver-list"><article class="driver-item"><label>Verfuegbarkeit<select name="mode"><option>verfuegbar</option><option>nicht verfuegbar</option><option>bevorzugt verfuegbar</option><option>nur Fruehschicht</option><option>nur Spaetschicht</option><option>nur Nachtschicht</option><option>keine Wochenenden</option><option>nur kurzfristig</option><option>Urlaub geplant</option></select></label><label>von<input type="date" name="start"></label><label>bis<input type="date" name="end"></label><label>Wunsch<select name="wishType"><option>gewuenschte Schicht</option><option>gewuenschter freier Tag</option><option>bevorzugtes Fahrzeug</option><option>bevorzugtes Einsatzgebiet</option><option>Tausch mit Mitarbeiter</option></select></label><label>Kommentar<input name="comment"></label><button class="driver-btn" type="submit">Senden</button></article></div></form><div data-portal-shift-list></div></article></section>

      <section class="driver-pane" data-portal-pane="dokumente"><article class="driver-card"><h2>Dokumente</h2><div data-portal-doc-list></div><form data-portal-doc-form><div class="driver-list"><article class="driver-item"><label>Rückfrage / Aktualisierung<input name="note" placeholder="Aktualisierung melden"></label><label>Demo-Datei<input name="demoFile"></label><button class="driver-btn" type="submit">Senden</button></article></div></form></article></section>

      <section class="driver-pane" data-portal-pane="mitteilungen"><article class="driver-card"><h2>Mitteilungen</h2><div data-portal-msg-list></div></article></section>

      <section class="driver-pane" data-portal-pane="qualitaet"><article class="driver-card"><h2>Persoenliche Qualitaetsthemen</h2><div data-portal-quality-list></div></article></section>

      <section class="driver-pane" data-portal-pane="profil"><article class="driver-card"><h2>Persoenliche Daten</h2><div data-portal-profile></div><form data-portal-profile-request><div class="driver-list"><article class="driver-item"><label>Aenderungswunsch<input name="request" placeholder="z. B. neue Telefonnummer"></label><button class="driver-btn" type="submit">Aenderungswunsch senden</button></article></div></form></article></section>
    </section>
  </main>

  <div class="driver-modal" data-portal-modal hidden>
    <div class="driver-modal-backdrop" data-portal-close></div>
    <section class="driver-modal-dialog" role="dialog" aria-modal="true">
      <header class="driver-modal-head"><h3 data-portal-modal-title>Mitarbeiterportal</h3><button class="driver-btn ghost" type="button" data-portal-close>Schliessen</button></header>
      <div class="driver-modal-body" data-portal-modal-body></div>
      <footer class="driver-modal-foot"><button class="driver-btn" type="button" data-portal-close>Fertig</button></footer>
    </section>
  </div>

  <script src="mitarbeiter.js"></script>
</body>
</html>
