<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wallet & Gutscheine | Taxi Germersheim</title>
  <meta name="description" content="Gutscheine im Kundenkonto von Taxi Germersheim." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="public-visual-repair.css" />
  <link rel="stylesheet" href="wallet-gutscheine.css" />
  <link rel="stylesheet" href="auth-demo.css" />
  <link rel="stylesheet" href="public-system.css" />
  <script src="public-system.js" defer></script>
</head>
<body class="wallet-v2-body auth-pending tg-public" data-tg-page="none">
  <div class="wallet-v2-app">
    <header class="topbar">
      <div class="brand">
        <a href="index.html" aria-label="Taxi Germersheim Startseite">
          <img src="logo.png" alt="Taxi Germersheim GmbH">
          <span>Taxi Germersheim</span>
        </a>
      </div>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a href="index.html">Startseite</a>
        <a href="index.html?page=services">Leistungen</a>
        <a href="flotte.html">Fahrzeugflotte</a>
        <a href="rewards.html">Rewards</a>
        <a href="hilfe-kontakt.html">Kontakt</a>
      </nav>
      <div class="top-actions">
        <a class="button nav-book-btn" href="meinkonto.html">Mein Konto</a>
      </div>
    </header>

    <main id="wallet-page" class="wallet-page">
      <div class="wallet-shell">
        <header class="wallet-page-head">
          <div>
            <p class="wallet-eyebrow">Dein Taxi-Germersheim-Konto</p>
            <h1>Gutscheine</h1>
            <p class="wallet-intro">Hier findest du deine verfügbaren und bereits verwendeten Gutscheine.</p>
          </div>
          <a class="wallet-secondary-link" href="rewards.html">Rewards ansehen</a>
        </header>

        <div class="wallet-voucher-content" id="voucherList" aria-live="polite" aria-busy="true">
          <div class="wallet-loading-state">
            <span aria-hidden="true"></span>
            <p>Gutscheine werden geladen …</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer id="kontakt" class="site-footer wallet-footer">
    <div class="wallet-footer-row">
      <p>&copy; 2026 Taxi Germersheim GmbH</p>
      <div class="wallet-footer-links">
        <a href="datenschutz.html">Datenschutz</a>
        <a href="impressum.html">Impressum</a>
        <a href="hilfe-kontakt.html">Kontakt</a>
      </div>
    </div>
  </footer>

  <script src="customer-auth.js"></script>
  <script src="script.js"></script>
  <script>
    (async function () {
      const auth = window.CustomerAuth || null;
      if (auth && typeof auth.hydrateSession === 'function') {
        await auth.hydrateSession();
      }

      const gated = !auth || typeof auth.requireLogin !== 'function' || auth.requireLogin({
        targetSelector: '#wallet-page',
        pageTitle: 'Wallet und Gutscheine',
        gateDescription: 'Melde dich an, um diesen Bereich zu sehen.'
      });
      document.body.classList.remove('auth-pending');

      if (gated) {
        return;
      }

      const voucherList = document.getElementById('voucherList');

      function formatMoney(valueCents) {
        return new Intl.NumberFormat('de-DE', {
          style: 'currency',
          currency: 'EUR'
        }).format(Number(valueCents || 0) / 100);
      }

      function formatDate(value) {
        if (!value) return '';
        const date = new Date(value.length === 10 ? value + 'T00:00:00' : value);
        return new Intl.DateTimeFormat('de-DE', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }).format(date);
      }

      function getVoucherStatus(voucher) {
        if (voucher.status === 'redeemed') return { label: 'Eingelöst', className: 'is-used' };
        if (voucher.status === 'blocked') return { label: 'Gesperrt', className: 'is-blocked' };
        const validUntil = new Date(voucher.valid_until + 'T23:59:59');
        if (validUntil < new Date()) return { label: 'Abgelaufen', className: 'is-expired' };
        return { label: 'Verfügbar', className: 'is-active' };
      }

      function appendMeta(container, label, value) {
        if (!value) return;
        const item = document.createElement('div');
        item.className = 'wallet-mini';
        const title = document.createElement('b');
        title.textContent = label;
        const content = document.createElement('span');
        content.textContent = value;
        item.append(title, content);
        container.appendChild(item);
      }

      function renderEmptyState() {
        voucherList.innerHTML = '';
        voucherList.setAttribute('aria-busy', 'false');
        const emptyState = document.createElement('section');
        emptyState.className = 'wallet-empty-state';
        const icon = document.createElement('div');
        icon.className = 'wallet-empty-icon';
        icon.setAttribute('aria-hidden', 'true');
        const image = document.createElement('img');
        image.src = 'assets/icons/Gift%20Voucher.svg';
        image.alt = '';
        icon.appendChild(image);
        const title = document.createElement('h2');
        title.textContent = 'Noch keine Gutscheine';
        const text = document.createElement('p');
        text.textContent = 'Sobald ein Gutschein für dein Konto verfügbar ist, findest du ihn hier.';
        const link = document.createElement('a');
        link.className = 'wallet-secondary-link';
        link.href = 'rewards.html';
        link.textContent = 'Rewards ansehen';
        emptyState.append(icon, title, text, link);
        voucherList.appendChild(emptyState);
      }

      function createVoucherCard(voucher, history) {
        const status = getVoucherStatus(voucher);
        const card = document.createElement('article');
        card.className = 'wallet-coupon' + (history ? ' is-history' : '');

        const top = document.createElement('div');
        top.className = 'wallet-coupon-top';
        const copy = document.createElement('div');
        const label = document.createElement('span');
        label.className = 'wallet-coupon-label';
        label.textContent = 'Gutschein';
        const value = document.createElement('strong');
        value.className = 'wallet-coupon-value';
        value.textContent = formatMoney(voucher.value_cents);
        copy.append(label, value);
        const statusNode = document.createElement('span');
        statusNode.className = 'wallet-status ' + status.className;
        statusNode.textContent = status.label;
        top.append(copy, statusNode);

        const codeBox = document.createElement('div');
        codeBox.className = 'wallet-code-box';
        const codeLabel = document.createElement('span');
        codeLabel.textContent = 'Code';
        const code = document.createElement('code');
        code.textContent = voucher.code;
        codeBox.append(codeLabel, code);

        const meta = document.createElement('div');
        meta.className = 'wallet-coupon-meta';
        appendMeta(meta, 'Gültig bis', formatDate(voucher.valid_until));
        appendMeta(meta, 'Eingelöst am', formatDate(voucher.redeemed_at));

        card.append(top, codeBox, meta);
        return card;
      }

      function createVoucherSection(title, vouchers, history) {
        const section = document.createElement('section');
        section.className = 'wallet-voucher-section' + (history ? ' is-history' : '');
        const head = document.createElement('div');
        head.className = 'wallet-section-head';
        const heading = document.createElement('h2');
        heading.textContent = title;
        head.appendChild(heading);
        const grid = document.createElement('div');
        grid.className = 'wallet-voucher-grid';
        vouchers.forEach(function (voucher) {
          grid.appendChild(createVoucherCard(voucher, history));
        });
        section.append(head, grid);
        return section;
      }

      function renderVouchers(vouchers) {
        const available = [];
        const history = [];
        vouchers.forEach(function (voucher) {
          const status = getVoucherStatus(voucher);
          if (voucher.status === 'open' && status.label === 'Verfügbar') {
            available.push(voucher);
          } else {
            history.push(voucher);
          }
        });

        voucherList.innerHTML = '';
        voucherList.setAttribute('aria-busy', 'false');
        if (!available.length && !history.length) {
          renderEmptyState();
          return;
        }
        if (available.length) {
          voucherList.appendChild(createVoucherSection('Verfügbare Gutscheine', available, false));
        }
        if (history.length) {
          voucherList.appendChild(createVoucherSection('Verlauf', history, true));
        }
      }

      function renderLoadError() {
        voucherList.innerHTML = '';
        voucherList.setAttribute('aria-busy', 'false');
        const errorState = document.createElement('section');
        errorState.className = 'wallet-message-state';
        const title = document.createElement('h2');
        title.textContent = 'Gutscheine nicht verfügbar';
        const text = document.createElement('p');
        text.textContent = 'Deine Gutscheine konnten gerade nicht geladen werden. Bitte versuche es erneut.';
        errorState.append(title, text);
        voucherList.appendChild(errorState);
      }

      try {
        const client = auth && typeof auth.getClient === 'function' ? await auth.getClient() : null;
        if (!client || typeof client.from !== 'function') {
          renderLoadError();
          return;
        }

        const { data, error } = await client
          .from('rewards_vouchers')
          .select('code, value_cents, status, valid_until, redeemed_at, issued_at')
          .order('issued_at', { ascending: false });

        if (error || !Array.isArray(data)) {
          renderLoadError();
          return;
        }

        renderVouchers(data);
      } catch (_error) {
        renderLoadError();
      }
    })();
  </script>
</body>
</html>
