<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Pruefungen</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="qualitaet-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="qualitaet.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="pruefungen.html">Pruefungen</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Betriebspruefungen</h1><p>Pruefungsplan, Durchfuehrung und Nachpruefung (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Pruefungsplan</h2></div><div class="q-table-wrap"><table class="admin-table q-table"><thead><tr><th>Pruefung</th><th>Bereich</th><th>Objekt</th><th>Verantwortlich</th><th>Faelligkeit</th><th>Intervall</th><th>letzte</th><th>naechste</th><th>Status</th><th>Ergebnis</th><th>Aktion</th></tr></thead><tbody data-pr-table></tbody></table></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Pruefung anlegen</h2></div><form class="q-form-grid" data-pr-plan-form><label>Pruefungsart<select name="type"><option>Fahrzeugkontrolle</option><option>Fuehrerscheinkontrolle</option><option>P-Schein-Kontrolle</option><option>Fahrzeugsauberkeit</option><option>Taxameterpruefung</option><option>Kartenlesegeraet</option><option>Verbandskasten</option><option>Warnwesten</option><option>Feuerloescher falls vorhanden</option><option>Rollstuhlrampe</option><option>Rollstuhlsicherung</option><option>Fahrzeugdokumente</option><option>Erste-Hilfe-Ausstattung</option><option>Datenschutz</option><option>Betriebsanweisung</option><option>Fahrerunterweisung</option><option>Zentrale</option><option>Kassenpruefung</option><option>Dokumentenpruefung</option><option>Sicherheitspruefung</option></select></label><label>Bereich<input name="area" placeholder="Fahrzeug/Zentrale/Mitarbeiter"></label><label>Pruefobjekt<input name="target"></label><label>Verantwortlich<input name="owner" value="Qualitaetsmanagement"></label><label>Faelligkeit<input type="date" name="dueDate"></label><label>Intervall<select name="interval"><option>taeglich</option><option>woechentlich</option><option>monatlich</option><option>quartalsweise</option><option>halbjaehrlich</option><option>jaehrlich</option><option>individuell</option></select></label><label>letzte Pruefung<input type="date" name="lastCheck"></label><label>naechste Pruefung<input type="date" name="nextCheck"></label><label class="full">Checkliste (durch Komma getrennt)<textarea name="checklist">Beleuchtung,Reifen,Scheiben,Spiegel,Kennzeichen,Sauberkeit,Sicherheitsausruestung,Taxameter,Kartenlesegeraet,Fahrzeugpapiere</textarea></label><div class="q-actions full"><button class="admin-btn" type="submit">Pruefung planen</button></div></form></section>
<div class="admin-modal" data-pr-modal hidden><div class="admin-modal-backdrop" data-pr-close></div><section class="admin-modal-dialog" role="dialog" aria-modal="true"><header class="admin-modal-head"><h3 data-pr-modal-title>Pruefung durchfuehren</h3><button class="admin-icon-btn" type="button" data-pr-close>✕</button></header><div class="admin-modal-body" data-pr-modal-body></div><footer class="admin-modal-foot" data-pr-modal-foot><button class="admin-btn admin-btn-secondary" type="button" data-pr-close>Schliessen</button></footer></section></div>
</main></div><script src="pruefungen.js"></script></body></html>
