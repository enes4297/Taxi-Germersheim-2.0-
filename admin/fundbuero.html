<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Fundbuero</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="qualitaet-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="qualitaet.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="fundbuero.html">Fundbuero</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Fundbuero</h1><p>Fundsachenverwaltung mit Zuordnung und Uebergabe (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Fundsachenuebersicht</h2></div><div class="q-grid" data-found-kpis></div><div class="q-table-wrap"><table class="admin-table q-table"><thead><tr><th>Fundnr.</th><th>Gegenstand</th><th>Fahrzeug/Fahrt</th><th>Fundzeit</th><th>Wert</th><th>Status</th><th>Kunde</th><th>Aufbewahrung</th><th>Aktion</th></tr></thead><tbody data-found-table></tbody></table></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Fundsache erfassen</h2></div><form class="q-form-grid" data-found-form><label>Fundnummer<input name="number"></label><label>Gegenstand<input name="object" required></label><label>Kategorie<select name="category"><option>Handy</option><option>Geldboerse</option><option>Schluessel</option><option>Tasche</option><option>Kleidung</option><option>Dokumente</option><option>Bargeld</option><option>Schmuck</option><option>Brille</option><option>Kopfhoerer</option><option>Medikament</option><option>Gepaeck</option><option>Kindersache</option><option>sonstiger Gegenstand</option></select></label><label>Beschreibung<input name="description"></label><label>Farbe<input name="color"></label><label>Marke<input name="brand"></label><label>Funddatum<input type="date" name="date"></label><label>Fundzeit<input type="time" name="time"></label><label>Fahrzeug<input name="vehicle"></label><label>Fahrer<input name="driver"></label><label>Fahrt<input name="rideId"></label><label>Sitzplatz/Fundort<input name="place"></label><label>Kunde zugeordnet<input name="customerAssigned" placeholder="z. B. K-1001"></label><label>Aufbewahrungsort<input name="storage" value="Zentrale"></label><label>Wertkategorie<select name="valueCategory"><option>gering</option><option>normal</option><option>hoch</option><option>besonders sensibel</option></select></label><label>Demo-Foto<input name="photo"></label><label>Status<select name="status"><option>neu</option><option>in Zentrale</option><option>Kunde gesucht</option><option>Kunde kontaktiert</option><option>Abholung vereinbart</option><option>abgeholt</option><option>nicht zugeordnet</option><option>Aufbewahrungsfrist laeuft</option><option>an Fundbuero uebergeben als Demo</option><option>entsorgt als Demo</option><option>archiviert</option></select></label><label class="full">interne Notiz<input name="note"></label><div class="q-actions full"><button class="admin-btn" type="submit">Fundsache speichern</button></div></form></section>
<div class="admin-modal" data-found-modal hidden><div class="admin-modal-backdrop" data-found-close></div><section class="admin-modal-dialog" role="dialog" aria-modal="true"><header class="admin-modal-head"><h3 data-found-modal-title>Fundsache</h3><button class="admin-icon-btn" type="button" data-found-close>✕</button></header><div class="admin-modal-body" data-found-modal-body></div><footer class="admin-modal-foot" data-found-modal-foot><button class="admin-btn admin-btn-secondary" type="button" data-found-close>Schliessen</button></footer></section></div>
</main></div><script src="fundbuero.js"></script></body></html>
