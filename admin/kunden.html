<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Germersheim - Kundenverwaltung</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="supabase-config.js"></script>
  <script src="supabase-auth.js"></script>
  <script src="auth.js"></script>
  <script src="sidebar.js"></script>
<link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="kunden-v14.css">
      </head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="Interne Navigation">
      <div class="admin-sidebar-brand">
        <img src="../logo.png" alt="Taxi Germersheim Logo">
        <div>
          <strong>Dispatcher</strong>
          <small>Interner Bereich</small>
        </div>
      </div>

      <nav class="admin-nav" data-admin-sidebar></nav>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-title">
          <h1>Kundenverwaltung</h1>
          <p>Interner Kundenbereich mit Demo-Daten, ohne Backend</p>
        </div>

        <div class="admin-topbar-actions">
          <img class="admin-topbar-logo" src="../logo.png" alt="Taxi Germersheim Logo">
          <button class="admin-icon-btn" type="button" aria-label="Benachrichtigungen">
            <span>🔔</span>
            <b data-customer-alert-count>5</b>
          </button>
          <button class="admin-user" type="button" aria-label="Benutzer">
            <span>Disposition</span>
            <strong>Enes</strong>
          </button>
        </div>
      </header>

      <section class="admin-panel customer-overview" aria-label="Kunden Dashboard">
        <div class="admin-panel-head">
          <h2>Kunden Dashboard</h2>
        </div>
        <div class="customer-overview-grid">
          <article class="customer-overview-card">
            <small>👥 Kunden gesamt</small>
            <strong data-customer-stat="total">0</strong>
          </article>
          <article class="customer-overview-card is-regular">
            <small><img class="admin-inline-icon" src="../assets/icons/Rewards.svg" alt="" aria-hidden="true">Stammkunden</small>
            <strong data-customer-stat="regular">0</strong>
          </article>
          <article class="customer-overview-card is-medical">
            <small>🏥 Krankenkassenfahrten</small>
            <strong data-customer-stat="medical">0</strong>
          </article>
          <article class="customer-overview-card is-company">
            <small>🏢 Firmenkunden</small>
            <strong data-customer-stat="company">0</strong>
          </article>
          <article class="customer-overview-card is-question">
            <small>❓ Offene Rückfragen</small>
            <strong data-customer-stat="openQuestions">0</strong>
          </article>
          <article class="customer-overview-card is-vip">
            <small>👑 VIP / Rewards</small>
            <strong data-customer-stat="vipRewards">0</strong>
          </article>
        </div>
      </section>

      <section class="admin-panel customer-tools" aria-label="Kunden Suche und Filter">
        <div class="customer-search-wrap">
          <label class="driver-label" for="customer-search-input">Kunde suchen</label>
          <input
            id="customer-search-input"
            class="driver-search-input"
            type="search"
            placeholder="Kunde, Telefonnummer oder Ziel suchen..."
            autocomplete="off"
            data-customer-search
          >
        </div>

        <div class="customer-v14-actions" role="group" aria-label="Kundenaktionen">
          <button class="admin-btn" type="button" data-customer-top-action="new">+ Neu</button>
          <button class="admin-btn admin-btn-secondary" type="button" data-customer-top-action="newBusiness">Geschäftskunde</button>
          <button class="admin-btn admin-btn-secondary" type="button" data-customer-top-action="duplicate">Dublette</button>
          <button class="admin-btn admin-btn-secondary" type="button" data-customer-top-action="reset">Filter zurücksetzen</button>
          <button class="admin-btn admin-btn-secondary" type="button" data-customer-top-action="phone">Telefonzentrale</button>
        </div>

        <div class="customer-filter-group" role="group" aria-label="Kundentyp filtern">
          <button class="customer-filter-btn is-active" type="button" data-customer-filter="Alle">Alle</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Privatkunde">Privatkunde</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Krankenfahrt">Krankenfahrt</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Geschäftskunde">Geschäftskunde</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Einrichtung">Einrichtung</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Bahnunternehmen">Bahnunternehmen</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Pflegeeinrichtung">Pflegeeinrichtung</button>
          <button class="customer-filter-btn" type="button" data-customer-filter="Rückfrage offen">Rückfrage offen</button>
        </div>
      </section>

      <section class="customer-v14-layout" aria-label="Kundenarbeitsbereich">
        <section class="customer-grid" aria-label="Kundenkarten" data-customer-grid></section>

        <aside class="admin-panel customer-profile-panel" aria-label="Kundenprofil">
          <div class="admin-panel-head">
            <h2>Kundenprofil</h2>
            <span class="customer-profile-id" data-customer-profile-id>-</span>
          </div>

          <div class="customer-profile-top" data-customer-profile-top></div>

          <div class="customer-profile-tabs" role="tablist" aria-label="Profilbereiche">
            <button class="customer-profile-tab is-active" type="button" data-customer-profile-tab="uebersicht">Übersicht</button>
            <button class="customer-profile-tab" type="button" data-customer-profile-tab="fahrten">Fahrten</button>
            <button class="customer-profile-tab" type="button" data-customer-profile-tab="serienfahrten">Serienfahrten</button>
            <button class="customer-profile-tab" type="button" data-customer-profile-tab="abrechnung">Abrechnung</button>
            <button class="customer-profile-tab" type="button" data-customer-profile-tab="notizen">Notizen</button>
          </div>

          <div class="customer-profile-pane is-visible" data-customer-profile-pane="uebersicht"></div>
          <div class="customer-profile-pane" data-customer-profile-pane="fahrten"></div>
          <div class="customer-profile-pane" data-customer-profile-pane="serienfahrten"></div>
          <div class="customer-profile-pane" data-customer-profile-pane="abrechnung"></div>
          <div class="customer-profile-pane" data-customer-profile-pane="notizen"></div>
        </aside>
      </section>

      <div class="admin-modal" data-customer-modal hidden>
        <div class="admin-modal-backdrop" data-customer-modal-close></div>
        <section class="admin-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="customer-modal-title">
          <header class="admin-modal-head">
            <h3 id="customer-modal-title" data-customer-modal-title>Kundendetails</h3>
            <button class="admin-icon-btn" type="button" aria-label="Modal schließen" data-customer-modal-close>✕</button>
          </header>
          <div class="admin-modal-body" data-customer-modal-body></div>
          <footer class="admin-modal-foot">
            <button class="admin-btn admin-btn-secondary" type="button" data-customer-modal-action="save">Speichern</button>
            <button class="admin-btn driver-btn-muted" type="button" data-customer-modal-close>Schließen</button>
          </footer>
        </section>
      </div>
    </main>
  </div>

  <script src="kunden.js"></script>
</body>
</html>
