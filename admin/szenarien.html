<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Szenarien</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="management-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="management.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="szenarien.html">Szenarien</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Szenarien</h1><p>Szenarioarten, Vergleich und Vorschlagsuebernahme (Demo)</p></div><div class="admin-topbar-actions m-actions"><button class="admin-btn admin-btn-secondary" type="button" data-sc-reset>"Szenarien zuruecksetzen"</button></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Szenario erstellen</h2></div><form class="m-form-grid" data-sc-form><label>Name<input name="name" required></label><label>Datum<input type="date" name="date"></label><label>Zeitraum<select name="period"><option value="today">heute</option><option value="tomorrow">morgen</option><option value="7d">naechste 7 Tage</option><option value="30d">naechste 30 Tage</option></select></label><label>Nachfragefaktor<input type="number" name="demandFactor" step="0.1" value="1"></label><label>verfuegbare Fahrer<input type="number" name="availableDrivers" value="10"></label><label>verfuegbare Fahrzeuge<input type="number" name="availableVehicles" value="8"></label><label>ausgefallene Fahrzeuge<input type="number" name="failedVehicles" value="0"></label><label>ausgefallene Fahrer<input type="number" name="failedDrivers" value="0"></label><label>besondere Fahrtarten<input name="specialTypes" placeholder="z. B. Rollstuhlfahrt, Flughafenfahrt"></label><label>Reserve<input type="number" name="reserve" value="1"></label><label class="full">Notizen<textarea name="notes"></textarea></label><div class="full"><button class="admin-btn" type="submit">Szenario speichern</button></div></form></section>
<section class="m-split"><section class="admin-panel"><div class="admin-panel-head"><h2>Szenarienliste</h2></div><div class="m-list" data-sc-list></div></section><aside class="admin-panel"><div class="admin-panel-head"><h2>Vergleich (max. 3)</h2></div><div class="m-list" data-sc-compare></div></aside></section>
</main></div><script src="szenarien.js"></script></body></html>
