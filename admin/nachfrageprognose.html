<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Nachfrageprognose</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="management-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="management.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="nachfrageprognose.html">Nachfrageprognose</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Nachfrageprognose</h1><p>Regelbasierte Demo-Prognose ohne KI und ohne externe APIs</p></div></header>
<section class="admin-panel"><div class="m-toolbar"><label>Zeitraum<select data-nf-period><option value="3h">naechste 3 Stunden</option><option value="today" selected>heute</option><option value="tomorrow">morgen</option><option value="7d">naechste 7 Tage</option><option value="30d">naechste 30 Tage</option></select></label><label>Wetter Demo<select data-nf-weather><option>trocken</option><option>regen</option><option>schnee</option><option>unwetter</option></select></label><label>Ferien Demo<select data-nf-holiday><option>nein</option><option>ja</option></select></label><label>Feiertag Demo<select data-nf-public><option>nein</option><option>ja</option></select></label><label>Eventeinfluss<select data-nf-event><option>normal</option><option>hoch</option></select></label><label>Sicherheit<select data-nf-confidence><option>geringe Sicherheit</option><option selected>mittlere Sicherheit</option><option>hohe Sicherheit</option></select></label></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Prognosezeitraum</h2></div><div class="m-grid" data-nf-summary></div></section>
<section class="m-split"><section class="admin-panel"><div class="admin-panel-head"><h2>Nachfrage nach Fahrtart</h2></div><div class="m-table-wrap"><table class="admin-table m-table"><thead><tr><th>Fahrtart</th><th>erwartet</th><th>gebucht</th><th>offene Kapazitaet</th><th>Fahrzeugtyp</th><th>Qualifikation</th></tr></thead><tbody data-nf-types></tbody></table></div></section><aside class="admin-panel"><div class="admin-panel-head"><h2>Prognose-Guete</h2></div><div data-nf-quality></div></aside></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Stundenverlauf</h2><small>Klick auf Zeile fuer Detailfenster</small></div><div class="m-list" data-nf-hours></div></section>
</main></div><script src="nachfrageprognose.js"></script></body></html>
