<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Beschwerden</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="qualitaet-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="qualitaet.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="beschwerden.html">Beschwerden</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Beschwerdemanagement</h1><p>Beschwerden, Kommunikation, Stellungnahmen und positives Feedback</p></div></header>
<section class="admin-panel q-toolbar"><label>Suche<input type="search" data-cmp-search placeholder="Fall, Kunde, Fahrer, Fahrzeug, Kategorie"></label><label>Zeitraum<select data-cmp-period><option>alle</option><option>heute</option><option>7 Tage</option><option>30 Tage</option></select></label><label>Status<select data-cmp-status><option>alle</option></select></label><label>Prioritaet<select data-cmp-priority><option>alle</option><option>Information</option><option>normal</option><option>wichtig</option><option>kritisch</option></select></label><label>Kategorie<select data-cmp-category><option>alle</option></select></label><label>Ansicht<select data-cmp-view><option value="table">Tabellenansicht</option><option value="cards">Kartenansicht</option></select></label></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Beschwerden</h2></div><div data-cmp-list></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Beschwerde erfassen</h2></div><form class="q-form-grid" data-cmp-form><label>Eingangsdatum<input type="date" name="inputDate" required></label><label>Uhrzeit<input type="time" name="inputTime" required></label><label>Kontaktweg<select name="channel"><option>Telefon</option><option>E-Mail</option><option>Website</option><option>persoenlich</option><option>Fahrer</option><option>Disposition</option><option>Google-Bewertung als Demo</option><option>Brief</option><option>sonstiger Weg</option></select></label><label>Kunde<input name="customer" required></label><label>Kunden-ID<input name="customerId" placeholder="z. B. K-1001"></label><label>Telefon<input name="phone"></label><label>E-Mail<input name="email"></label><label>Fahrt<input name="rideId"></label><label>Fahrer<input name="driver"></label><label>Fahrer-ID<input name="driverId" placeholder="z. B. MA-101"></label><label>Fahrzeug<input name="vehicle"></label><label>Kategorie<select name="category" data-cmp-cat-input></select></label><label>Unterkategorie<input name="subCategory"></label><label>Kurzbeschreibung<input name="shortText" required></label><label class="full">Beschreibung<textarea name="description" required></textarea></label><label>gewuenschte Loesung<select name="desiredSolution"><option>Entschuldigung</option><option>Rueckruf</option><option>interne Klaerung</option><option>Fahrerhinweis</option><option>Schulung</option><option>Fahrzeugreinigung</option><option>technische Pruefung</option><option>Fahrtkorrektur</option><option>Preispruefung</option><option>Gutschein als Demo</option><option>Erstattung als Demo</option><option>keine Massnahme</option><option>Beschwerde unbegruendet</option></select></label><label>Prioritaet<select name="priority"><option>Information</option><option>normal</option><option>wichtig</option><option>kritisch</option></select></label><label>Rueckruf erforderlich<select name="callbackOpen"><option value="false">Nein</option><option value="true">Ja</option></select></label><label>Frist<input type="date" name="dueDate"></label><label>Bearbeiter<input name="owner" value="Qualitaetsmanagement"></label><label>Eskalationsstufe<select name="escalation"><option>Stufe 0 - normal</option><option>Stufe 1 - Bearbeiter</option><option>Stufe 2 - Bereichsverantwortlicher</option><option>Stufe 3 - Geschaeftsleitung</option><option>Stufe 4 - kritisch</option></select></label><label>Route<input name="route" placeholder="z. B. Speyer - Germersheim"></label><label class="full">interne Notiz<input name="internalAssessment"></label><label>Demo-Anhang<input name="attachment"></label><label>Kundenauswirkung (1-4)<input type="number" min="1" max="4" name="customerImpact" value="2"></label><label>Sicherheitsrisiko (1-4)<input type="number" min="1" max="4" name="safetyRisk" value="1"></label><label>Rechtsrisiko (1-4)<input type="number" min="1" max="4" name="legalRisk" value="1"></label><label>Reputationsrisiko (1-4)<input type="number" min="1" max="4" name="reputationalRisk" value="2"></label><label>Wiederholungsgefahr (1-4)<input type="number" min="1" max="4" name="recurrenceRisk" value="2"></label><label>Dringlichkeit (1-4)<input type="number" min="1" max="4" name="urgency" value="2"></label><div class="q-actions full"><button class="admin-btn" type="submit">Beschwerde speichern</button></div></form></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Positives Feedback erfassen</h2></div><form class="q-form-grid" data-praise-form><label>Kunde<input name="customer" required></label><label>Kunden-ID<input name="customerId"></label><label>Fahrer<input name="driver"></label><label>Fahrer-ID<input name="driverId"></label><label>Fahrzeug<input name="vehicle"></label><label>Fahrt<input name="rideId"></label><label>Kategorie<select name="category"><option>Freundlichkeit</option><option>Hilfsbereitschaft</option><option>Puenktlichkeit</option><option>sichere Fahrweise</option><option>Sauberkeit</option><option>Krankenfahrt</option><option>Rollstuhlfahrt</option><option>besonderer Einsatz</option><option>Kundenservice</option></select></label><label>Eingangsweg<select name="channel"><option>Telefon</option><option>E-Mail</option><option>Website</option><option>persoenlich</option></select></label><label>Datum<input type="date" name="date"></label><label>interne Freigabe<select name="internalRelease"><option value="true">Ja</option><option value="false">Nein</option></select></label><label>Mitarbeiter informieren<select name="informEmployee"><option value="true">Ja</option><option value="false">Nein</option></select></label><label class="full">Nachricht<textarea name="message" required></textarea></label><div class="q-actions full"><button class="admin-btn admin-btn-secondary" type="submit">Feedback speichern</button></div></form></section>
<div class="admin-modal" data-cmp-modal hidden><div class="admin-modal-backdrop" data-cmp-close></div><section class="admin-modal-dialog" role="dialog" aria-modal="true"><header class="admin-modal-head"><h3 data-cmp-modal-title>Beschwerdedetails</h3><button class="admin-icon-btn" type="button" data-cmp-close>✕</button></header><div class="admin-modal-body" data-cmp-modal-body></div><footer class="admin-modal-foot" data-cmp-modal-foot><button class="admin-btn admin-btn-secondary" type="button" data-cmp-close>Schliessen</button></footer></section></div>
</main></div><script src="beschwerden.js"></script></body></html>
