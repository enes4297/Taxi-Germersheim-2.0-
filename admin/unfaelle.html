<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Unfaelle</title><meta name="robots" content="noindex,nofollow">
  <script src="supabase-config.js"></script>
  <script src="supabase-auth.js"></script>
  <script src="auth.js"></script>
  <script src="qualitaet-shared.js"></script>
<link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="qualitaet.css">      </head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="unfaelle.html">Unfaelle</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Unfallmanagement</h1><p>Gefuehrte Unfallmeldung mit Folgeaktionen (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Unfalluebersicht</h2></div><div class="q-grid" data-acc-kpis></div><div class="q-table-wrap"><table class="admin-table q-table"><thead><tr><th>ID</th><th>Datum</th><th>Ort</th><th>Fahrer</th><th>Fahrzeug</th><th>Art</th><th>Fahrbereit</th><th>Status</th><th>Dokumente</th><th>Aktion</th></tr></thead><tbody data-acc-table></tbody></table></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Unfallmeldung (6 Schritte)</h2></div><form class="q-form-grid" data-acc-form><label>Datum<input type="date" name="date" required></label><label>Uhrzeit<input type="time" name="time" required></label><label>Ort<input name="location" required></label><label>Fahrer<input name="driver" required></label><label>Fahrer-ID<input name="driverId"></label><label>Fahrzeug<input name="vehicle" required></label><label>Fahrt<input name="rideId"></label><label>Fahrgaeste im Fahrzeug<select name="passengers"><option>Nein</option><option>Ja</option></select></label><label>Unfallart<select name="accidentType"><option>Auffahrunfall</option><option>Parkschaden</option><option>Rangierschaden</option><option>Wildunfall</option><option>Alleinunfall</option><option>Seitenschaden</option><option>Kreuzungsunfall</option><option>Fussgaenger oder Radfahrer beteiligt</option><option>sonstiger Unfall</option></select></label><label>Unfallgegner<input name="opponent"></label><label>Kennzeichen<input name="opponentPlate"></label><label>Kontaktdaten Gegner<input name="opponentContact"></label><label>Versicherung als Demo<input name="opponentInsuranceDemo"></label><label>Zeugen<input name="witnesses"></label><label>Polizei<select name="policeDemo"><option>Nein</option><option>Ja</option></select></label><label>eigenes Fahrzeugschaden<input name="ownVehicleDamage"></label><label>Fremdfahrzeugschaden<input name="thirdPartyDamage"></label><label>Gegenstandsschaden<input name="objectDamage"></label><label>Personen verletzt als Demo<select name="injuriesDemo"><option>Nein</option><option>Ja</option></select></label><label>Fahrzeug fahrbereit<select name="drivable"><option>Ja</option><option>Nein</option></select></label><label>Polizei gerufen<select name="policeCalled"><option>Nein</option><option>Ja</option></select></label><label>Rettungsdienst gerufen<select name="medicCalled"><option>Nein</option><option>Ja</option></select></label><label>Abschleppdienst gerufen<select name="towingCalled"><option>Nein</option><option>Ja</option></select></label><label>Werkstatt informiert<select name="workshopInformed"><option>Ja</option><option>Nein</option></select></label><label>Ersatzfahrzeug organisiert<select name="replacementVehicle"><option>Nein</option><option>Ja</option></select></label><label>Fahrgaeste weiterbefoerdert<select name="passengersContinued"><option>Nein</option><option>Ja</option></select></label><label>Unfallskizze als Demo<input name="sketchDemo"></label><label>Fotos als Demo<input name="photosDemo"></label><label>Fahrerstellungnahme<select name="driverStatement"><option>angefordert</option><option>eingegangen</option></select></label><label>Zeugenangaben<select name="witnessStatement"><option>offen</option><option>vorhanden</option></select></label><label>Status<select name="status"><option>neu</option><option>erste Pruefung</option><option>Unterlagen fehlen</option><option>Versicherung vorbereitet</option><option>Werkstattpruefung</option><option>Fahrzeug gesperrt</option><option>in Reparatur</option><option>Rueckfrage</option><option>abgeschlossen</option><option>archiviert</option></select></label><label class="full">Beschreibung<textarea name="description" required></textarea></label><div class="q-actions full"><button class="admin-btn admin-btn-warning" type="submit">Unfall speichern</button></div><p class="q-note full">Hinweis: Keine echte Versicherungs- oder Behoerdenanbindung im Demo-System.</p></form></section>
</main></div><script src="unfaelle.js"></script></body></html>
