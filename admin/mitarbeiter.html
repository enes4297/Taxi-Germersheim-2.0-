<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Germersheim - Mitarbeiter</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="auth.js"></script>
  <script src="personal-shared.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-auth.js"></script>
  <script src="taxi-data-service.js"></script>
  <script src="ui-visible-terms.js"></script>
  <script src="ui-text.js"></script>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="personal.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" aria-label="Interne Navigation">
    <div class="admin-sidebar-brand">
      <img src="../logo.png" alt="Taxi Germersheim Logo">
      <div><strong>Dispatcher</strong><small>Interner Bereich</small></div>
    </div>
    <nav class="admin-nav"><a class="admin-nav-item is-active" href="mitarbeiter.html">Mitarbeiter</a></nav>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-title">
        <h1>Mitarbeiterverwaltung</h1>
        <p>Mitarbeiterliste, Akte und Einsatzprofil für Disposition (Demo)</p>
      </div>
    </header>

    <section class="admin-panel person-tools">
      <label>Suche
        <input type="search" data-emp-search placeholder="Name, ID, Telefon, E-Mail, Rolle, Status">
      </label>
      <label>Filter
        <select data-emp-filter>
          <option>alle</option>
          <option>aktiv</option>
          <option>inaktiv</option>
          <option>Fahrer</option>
          <option>Disposition</option>
          <option>Verwaltung</option>
          <option>Admin</option>
          <option>Vollzeit</option>
          <option>Teilzeit</option>
          <option>Minijob</option>
          <option>Aushilfe</option>
          <option>Springer</option>
          <option>Probezeit</option>
          <option>Urlaub</option>
          <option>krank</option>
          <option>Dokument laeuft ab</option>
          <option>Schulung offen</option>
          <option>Führerschein ungültig</option>
          <option>Taxischein ungültig</option>
        </select>
      </label>
      <label>Sortierung
        <select data-emp-sort>
          <option value="name">Name</option>
          <option value="status">Status</option>
          <option value="entry">Eintrittsdatum</option>
          <option value="role">Rolle</option>
        </select>
      </label>
      <div class="person-actions">
        <button class="admin-btn" type="button" data-emp-view="cards">Kartenansicht</button>
        <button class="admin-btn admin-btn-secondary" type="button" data-emp-view="table">Tabellenansicht</button>
      </div>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-head">
        <h2>Mitarbeiter-Zentrale</h2>
        <div class="person-actions">
          <button class="admin-btn admin-btn-secondary" type="button" data-cockpit-refresh>Aktualisieren</button>
        </div>
      </div>
      <div data-emp-cockpit></div>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-head"><h2>Mitarbeiterliste</h2></div>
      <div data-emp-list></div>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-head">
        <h2 data-emp-form-title>Neuen Mitarbeiter anlegen</h2>
        <div class="person-actions">
          <button class="admin-btn admin-btn-secondary" type="button" data-emp-add>Mitarbeiter hinzufügen</button>
        </div>
      </div>
      <div data-emp-form-panel hidden>
      <form class="person-form-grid" data-emp-form>
        <label>Vorname<input name="firstName" required></label>
        <label>Nachname<input name="lastName" required></label>
        <label>Geburtsdatum<input type="date" name="birthDate" required></label>

        <label>Geburtsort<input name="birthPlace"></label>
        <label>Telefon<input name="phone" required></label>
        <label>Alternative Telefonnummer<input name="altPhone"></label>

        <label>E-Mail<input type="email" name="email"></label>
        <label>Anschrift<input name="address"></label>
        <label>Sprache<input name="language"></label>

        <label>Mitarbeiter-ID<input name="employeeId" required></label>
        <label>Rolle
          <select name="role">
            <option>Fahrer</option>
            <option>Disposition</option>
            <option>Verwaltung</option>
            <option>Admin</option>
          </select>
        </label>
        <label>Beschäftigungsart
          <select name="employmentType">
            <option>Festangestellt</option>
            <option>Teilzeit</option>
            <option>Minijob</option>
            <option>Sonstiges</option>
          </select>
        </label>

        <label>Eintrittsdatum<input type="date" name="entryDate"></label>
        <label>Probezeit bis<input type="date" name="probationUntil"></label>
        <label>Vertragsbeginn<input type="date" name="contractStart"></label>

        <label>Vertragsende<input type="date" name="contractEnd"></label>
        <label>Standort<input name="location"></label>
        <label>Status
          <select name="status">
            <option>aktiv</option>
            <option>im Dienst</option>
            <option>frei</option>
            <option>in Probezeit</option>
            <option>Urlaub</option>
            <option>krank</option>
            <option>gesperrt</option>
            <option>nicht verfuegbar</option>
          </select>
        </label>

        <label>Schichtmodell<input name="shiftModel"></label>
        <label>Bevorzugte Arbeitszeiten<input name="preferredHours"></label>
        <label>Führerscheinklasse<input name="licenseClass"></label>

        <label>Führerscheinnummer<input name="licenseNo"></label>
        <label>Führerschein gültig bis<input type="date" name="licenseValidUntil"></label>
        <label>Führerschein geprüft am<input type="date" name="licenseCheckedAt"></label>

        <label>Führerschein geprüft durch<input name="licenseCheckedBy"></label>
        <label>Taxischein / Personenbeförderungsschein vorhanden
          <select name="pPermit">
            <option>Ja</option>
            <option>Nein</option>
          </select>
        </label>
        <label>Taxischein gültig bis<input type="date" name="pPermitValidUntil"></label>

        <label>Taxischein geprüft am<input type="date" name="pPermitCheckedAt"></label>
        <label>Taxischein geprüft durch<input name="pPermitCheckedBy"></label>
        <label>Dokumentstatus
          <select name="documentStatus">
            <option>gültig</option>
            <option>läuft bald ab</option>
            <option>abgelaufen</option>
            <option>fehlt</option>
            <option>ungeprüft</option>
            <option>gesperrt</option>
          </select>
        </label>

        <label>Bevorzugtes Fahrzeug<input name="preferredVehicle"></label>
        <label>Erlaubte Fahrzeuge (Komma getrennt)<input name="allowedVehicles"></label>
        <label>Nicht erlaubte Fahrzeuge (Komma getrennt)<input name="blockedVehicles"></label>

        <label>Feste Fahrzeugzuordnung<input name="fixedVehicle"></label>
        <label>Ersatzfahrzeuge (Komma getrennt)<input name="replacementVehicles"></label>
        <label>Bevorzugte Einsatzart<input name="preferredServiceType"></label>

        <label>Rollstuhlfahrten moeglich
          <select name="wheelchairSkill"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>
        <label>Grossraumfahrzeug moeglich
          <select name="largeVehicleSkill"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>
        <label>Elektrofahrzeug-Einweisung
          <select name="evTraining"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>

        <label>Qualifikationen (Komma getrennt)
          <textarea name="qualifications"></textarea>
        </label>
        <label>Notfallkontakt Name<input name="emName"></label>
        <label>Notfallkontakt Beziehung<input name="emRelation"></label>

        <label>Notfallkontakt Telefon<input name="emPhone"></label>
        <label>Notfallkontakt Alt Telefon<input name="emAltPhone"></label>
        <label>Interner Ansprechpartner<input name="internalContact"></label>

        <label>Interne Notizen<textarea name="internalNotes"></textarea></label>
        <label>Startunterlagen vollstaendig
          <select name="onboardingDocsDone"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>
        <label>Arbeitskleidung ausgegeben
          <select name="clothingIssued"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>

        <label>Schluessel ausgegeben
          <select name="keysIssued"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>
        <label>Tablet ausgegeben
          <select name="tabletIssued"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>
        <label>Zugangsdaten ausgegeben
          <select name="credentialsIssued"><option value="true">Ja</option><option value="false">Nein</option></select>
        </label>

        <div class="person-actions">
          <button class="admin-btn" type="submit" data-emp-form-submit>Mitarbeiter anlegen</button>
        </div>
      </form>
      </div>
      <p class="person-meta" data-emp-feedback role="status" aria-live="polite"></p>
      <p class="person-meta">Hinweis: Keine Bank-, Steuer- oder Gehaltsdaten werden verarbeitet.</p>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-head"><h2>Mitarbeiterakte</h2></div>
      <div data-emp-profile></div>
    </section>

    <div class="admin-modal" data-emp-modal hidden>
      <div class="admin-modal-backdrop" data-emp-close></div>
      <section class="admin-modal-dialog" role="dialog" aria-modal="true">
        <header class="admin-modal-head">
          <h3 data-emp-modal-title>Dublette erkannt</h3>
          <button class="admin-icon-btn" type="button" data-emp-close>✕</button>
        </header>
        <div class="admin-modal-body" data-emp-modal-body></div>
        <footer class="admin-modal-foot" data-emp-modal-foot>
          <button class="admin-btn admin-btn-secondary" type="button" data-emp-close>Schliessen</button>
        </footer>
      </section>
    </div>
  </main>
</div>
<script src="mitarbeiter.js"></script>
</body>
</html>
