<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Ziele</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="management-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="management.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="ziele.html">Ziele</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Ziele</h1><p>Zielsystem mit Fortschritt, Trend und Verknuepfungen (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Ziel erstellen</h2></div><form class="m-form-grid" data-goal-form><label>Titel<input name="title" required></label><label>Kategorie<select name="category"><option>Betrieb</option><option>Kundenservice</option><option>Pünktlichkeit</option><option>Fahrzeugverfuegbarkeit</option><option>Personal</option><option>Dokumente</option><option>Qualitaet</option><option>Abrechnung</option><option>Wachstum</option><option>Digitalisierung</option></select></label><label>Zeitraum<input name="period" value="Monat"></label><label>Zielwert<input type="number" name="target" required></label><label>aktueller Wert<input type="number" name="current" required></label><label>Einheit<input name="unit" value="%"></label><label>Verantwortlicher<input name="owner" value="Geschaeftsleitung"></label><label>Status<select name="status"><option>nicht gestartet</option><option>im Plan</option><option>leicht gefaehrdet</option><option>kritisch</option><option>erreicht</option><option>verfehlt</option><option>pausiert</option></select></label><label>Prioritaet<select name="priority"><option>normal</option><option>hoch</option><option>kritisch</option></select></label><label class="full">Massnahmen<input name="measures"></label><label class="full">Kommentar<input name="comment"></label><div class="full"><button class="admin-btn" type="submit">Ziel speichern</button></div></form></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Zieluebersicht</h2></div><div class="m-table-wrap"><table class="admin-table m-table"><thead><tr><th>Titel</th><th>Kategorie</th><th>Status</th><th>Fortschritt</th><th>Trend</th><th>Abweichung</th><th>naechste Massnahme</th><th>Verknuepfung</th></tr></thead><tbody data-goal-table></tbody></table></div></section>
</main></div><script src="ziele.js"></script></body></html>
