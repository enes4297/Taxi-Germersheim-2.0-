<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Massnahmen</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="qualitaet-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="qualitaet.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="massnahmen.html">Massnahmen</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Massnahmenmanagement</h1><p>Massnahmen, Fristen und Wirksamkeit (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Massnahmenuebersicht</h2></div><div class="q-table-wrap"><table class="admin-table q-table"><thead><tr><th>ID</th><th>Titel</th><th>Typ</th><th>Quelle</th><th>Verantwortlich</th><th>Frist</th><th>Prioritaet</th><th>Status</th><th>Eskalation</th><th>Aktion</th></tr></thead><tbody data-act-table></tbody></table></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Massnahme erstellen</h2></div><form class="q-form-grid" data-act-form><label>Titel<input name="title" required></label><label>Massnahmenart<select name="type"><option>Sofortmassnahme</option><option>Korrekturmassnahme</option><option>Praeventionsmassnahme</option><option>Schulung</option><option>Unterweisung</option><option>technische Pruefung</option><option>Fahrzeugreparatur</option><option>Prozessaenderung</option><option>Gespraech</option><option>Dokument aktualisieren</option><option>Kontrolle wiederholen</option><option>Kundenrueckmeldung</option><option>Fahrerhinweis</option><option>sonstige Massnahme</option></select></label><label>Quelle<select name="source"><option>Beschwerde</option><option>Vorfall</option><option>Unfall</option><option>Pruefung</option><option>allgemein</option></select></label><label>Bezug-ID<input name="sourceId"></label><label>Verantwortlicher<input name="owner" value="Qualitaetsmanagement"></label><label>Startdatum<input type="date" name="startDate"></label><label>Frist<input type="date" name="dueDate"></label><label>Prioritaet<select name="priority"><option>Information</option><option>normal</option><option>wichtig</option><option>kritisch</option></select></label><label>Status<select name="status"><option>geplant</option><option>freigegeben</option><option>in Bearbeitung</option><option>wartet</option><option>umgesetzt</option><option>Wirksamkeit pruefen</option><option>wirksam</option><option>nicht wirksam</option><option>abgeschlossen</option><option>abgebrochen</option></select></label><label>Erfolgskriterium<input name="successCriteria"></label><label>Nachweis<input name="proof"></label><label>Eskalation<select name="escalation"><option>Stufe 0 - normal</option><option>Stufe 1 - Bearbeiter</option><option>Stufe 2 - Bereichsverantwortlicher</option><option>Stufe 3 - Geschaeftsleitung</option><option>Stufe 4 - kritisch</option></select></label><label class="full">Beschreibung<textarea name="description" required></textarea></label><label class="full">interne Notiz<textarea name="note"></textarea></label><div class="q-actions full"><button class="admin-btn" type="submit">Massnahme speichern</button></div></form></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>5-Warum-Analyse</h2></div><form class="q-form-grid" data-cause-form><label>Quelle<select name="sourceType"><option>Beschwerde</option><option>Vorfall</option><option>Unfall</option><option>Pruefung</option></select></label><label>Fall-ID<input name="sourceId"></label><label>Ursachenkategorie<select name="category"><option>Mensch</option><option>Fahrzeug</option><option>Technik</option><option>Kommunikation</option><option>Planung</option><option>Prozess</option><option>Dokumentation</option><option>Schulung</option><option>externe Ursache</option><option>Kunde</option><option>Wetter</option><option>Verkehr</option><option>sonstige Ursache</option></select></label><label class="full">Problem<input name="problem" required></label><label>Warum 1<input name="why1"></label><label>Warum 2<input name="why2"></label><label>Warum 3<input name="why3"></label><label>Warum 4<input name="why4"></label><label>Warum 5<input name="why5"></label><label>vermutete Hauptursache<input name="mainCause"></label><label class="full">empfohlene Massnahme<input name="recommendedAction"></label><div class="q-actions full"><button class="admin-btn admin-btn-secondary" type="submit">Analyse speichern</button></div></form><div class="q-list" data-cause-list></div></section>
</main></div><script src="massnahmen.js"></script></body></html>
