<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Germersheim - Admin Login</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="admin-login-shell">
    <section class="admin-login-card" aria-label="Admin Login">
      <div class="admin-login-brand">
        <img src="../logo.png" alt="Taxi Germersheim Logo">
        <div>
          <strong>Taxi Germersheim</strong>
          <small>Interner Bereich</small>
        </div>
      </div>

      <header class="admin-login-head">
        <h1>Admin Login</h1>
        <p>Interner Bereich für Disposition, Verwaltung und Geschäftsleitung</p>
      </header>

      <form class="admin-login-form" data-login-form novalidate>
        <label for="admin-username">Benutzername oder E-Mail</label>
        <input id="admin-username" name="username" type="text" autocomplete="username" required>

        <label for="admin-password">Passwort oder PIN</label>
        <div class="admin-login-password-wrap">
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          <button class="admin-btn admin-btn-secondary admin-login-toggle" type="button" data-login-toggle-password aria-label="Passwort anzeigen oder verbergen">Anzeigen</button>
        </div>

        <p class="admin-login-error" data-login-error hidden></p>

        <button class="admin-btn" type="submit">Anmelden</button>

        <div class="admin-login-recovery-links">
          <button class="admin-link-btn" type="button" data-recovery-open="password">Passwort oder PIN vergessen?</button>
          <button class="admin-link-btn" type="button" data-recovery-open="username">Benutzername vergessen?</button>
          <button class="admin-link-btn" type="button" data-recovery-open="access">Probleme bei der Anmeldung? Zugang wiederherstellen</button>
        </div>
      </form>

      <p class="admin-login-hint">Echte interne Anmeldung über Supabase Auth.</p>

      <div class="admin-modal" data-recovery-modal hidden>
        <div class="admin-modal-backdrop" data-recovery-close></div>
        <section class="admin-modal-dialog admin-recovery-dialog" role="dialog" aria-modal="true" aria-labelledby="recovery-title">
          <header class="admin-modal-head">
            <h3 id="recovery-title" data-recovery-title>Zugang wiederherstellen</h3>
            <button class="admin-icon-btn" type="button" data-recovery-close aria-label="Dialog schließen">✕</button>
          </header>
          <div class="admin-modal-body admin-recovery-body" data-recovery-body></div>
          <footer class="admin-modal-foot admin-recovery-foot" data-recovery-foot></footer>
        </section>
      </div>
    </section>
  </main>

  <script src="ui-visible-terms.js"></script>
  <script src="ui-text.js"></script>
  <script src="login.js"></script>
</body>
</html>
