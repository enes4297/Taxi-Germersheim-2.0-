<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Mitteilungen</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="personal-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="personal.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="mitteilungen.html">Mitteilungen</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Interne Mitteilungen</h1><p>Mitteilungscenter mit Lesebestaetigungen (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Mitteilung erstellen</h2></div><form class="person-form-grid" data-msg-form><label>Titel<input name="title" required></label><label>Nachricht<textarea name="text" required></textarea></label><label>Kategorie<select name="category"><option>allgemeine Information</option><option>wichtig</option><option>Dienstplanaenderung</option><option>Fahrzeughinweis</option><option>Schulung</option><option>Dokumentenfrist</option><option>Betriebsanweisung</option><option>Notfallinformation</option><option>Veranstaltung</option><option>interne Erinnerung</option></select></label><label>Prioritaet<select name="priority"><option>normal</option><option>wichtig</option></select></label><label>Empfaenger<select name="recipients"><option>alle Mitarbeiter</option><option>alle Fahrer</option><option>Disposition</option><option>Verwaltung</option><option>einzelne Mitarbeiter</option><option>bestimmte Schicht</option><option>bestimmte Fahrzeuggruppe</option></select></label><label>Rollen<input name="roles" placeholder="z. B. Fahrer,Disposition"></label><label>einzelne Mitarbeiter IDs<input name="employeeIds" placeholder="MA-101,MA-102"></label><label>gueltig von<input type="date" name="from"></label><label>gueltig bis<input type="date" name="to"></label><label>Bestaetigung erforderlich<select name="confirmRequired"><option value="true">Ja</option><option value="false">Nein</option></select></label><label>Anhang (Demo)<input name="attachment"></label><label>erstellt durch<input name="createdBy" value="Admin Enes"></label><div class="person-actions"><button class="admin-btn" type="submit">Mitteilung senden</button></div></form></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Mitteilungen</h2></div><div class="person-table-wrap"><table class="admin-table person-table"><thead><tr><th>Titel</th><th>Kategorie</th><th>Prioritaet</th><th>Empfaenger</th><th>Zeitraum</th><th>gelesen</th><th>bestaetigt</th><th>letzte Erinnerung</th><th>Status</th><th>Aktion</th></tr></thead><tbody data-msg-table></tbody></table></div></section>
</main></div><script src="mitteilungen.js"></script></body></html>
