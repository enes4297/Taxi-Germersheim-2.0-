<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taxi Germersheim - Vorfaelle</title><meta name="robots" content="noindex,nofollow"><script src="auth.js"></script><script src="qualitaet-shared.js"></script><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="qualitaet.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar" aria-label="Interne Navigation"><div class="admin-sidebar-brand"><img src="../logo.png" alt="Taxi Germersheim Logo"><div><strong>Dispatcher</strong><small>Interner Bereich</small></div></div><nav class="admin-nav"><a class="admin-nav-item is-active" href="vorfaelle.html">Vorfaelle</a></nav></aside><main class="admin-main">
<header class="admin-topbar"><div class="admin-topbar-title"><h1>Vorfallmanagement</h1><p>Vorfaelle, Beinaheunfaelle und Sicherheitsmeldungen (Demo)</p></div></header>
<section class="admin-panel"><div class="admin-panel-head"><h2>Vorfaelle</h2></div><div class="q-table-wrap"><table class="admin-table q-table"><thead><tr><th>ID</th><th>Datum</th><th>Kategorie</th><th>Prioritaet</th><th>Fahrer</th><th>Fahrzeug</th><th>Fahrt</th><th>Status</th><th>Frist</th><th>Aktion</th></tr></thead><tbody data-inc-table></tbody></table></div></section>
<section class="admin-panel"><div class="admin-panel-head"><h2>Vorfall erfassen</h2></div><form class="q-form-grid" data-inc-form><label>Datum<input type="date" name="date" required></label><label>Uhrzeit<input type="time" name="time" required></label><label>Melder<input name="reporter" value="Disponent"></label><label>Kategorie<select name="category" data-inc-cat-input></select></label><label>Prioritaet<select name="priority"><option>Information</option><option>normal</option><option>wichtig</option><option>kritisch</option></select></label><label>Fahrer<input name="driver"></label><label>Fahrer-ID<input name="driverId"></label><label>Fahrzeug<input name="vehicle"></label><label>Kunde<input name="customer"></label><label>Fahrt<input name="rideId"></label><label>Standort<input name="location"></label><label>Frist<input type="date" name="dueDate"></label><label class="full">Beschreibung<textarea name="description" required></textarea></label><label class="full">unmittelbare Massnahme<input name="immediateAction"></label><label>Weiterfahrt moeglich<select name="continueRide"><option>Ja</option><option>Nein</option></select></label><label>Zentrale informiert<select name="centerInformed"><option>Ja</option><option>Nein</option></select></label><label>Polizei informiert als Demo<select name="policeInformedDemo"><option>Nein</option><option>Ja</option></select></label><label>Rettungsdienst informiert als Demo<select name="medicInformedDemo"><option>Nein</option><option>Ja</option></select></label><label>Demo-Anhang<input name="attachment"></label><label>Bearbeiter<input name="owner" value="Qualitaetsmanagement"></label><label>Status<select name="status"><option>neu</option><option>in Pruefung</option><option>Rueckfrage</option><option>Massnahme erforderlich</option><option>Massnahme laeuft</option><option>beobachtet</option><option>geklaert</option><option>abgeschlossen</option><option>eskaliert</option></select></label><label class="full">Beinaheunfall: Gefahrensituation<input name="danger"></label><label class="full">Beinaheunfall: moegliche Folgen<input name="possibleImpact"></label><label class="full">Beinaheunfall: warum kein Unfall<input name="whyNoAccident"></label><label>Wetter als Demo<input name="weatherDemo"></label><label>Verkehrssituation<input name="traffic"></label><label class="full">empfohlene Praevention<input name="prevention"></label><label class="full">Medizinischer Zwischenfall (orga Notiz, keine Diagnose)<input name="medicalNote"></label><div class="q-actions full"><button class="admin-btn" type="submit">Vorfall speichern</button></div><p class="q-note full">Hinweis: Bei akuten medizinischen Notfaellen immer 112 anrufen.</p></form></section>
</main></div><script src="vorfaelle.js"></script></body></html>
